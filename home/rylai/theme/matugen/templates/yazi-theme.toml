# Yazi Theme - Matugen generated

[mgr]
cwd = { fg = "{{ colors.primary.default.hex }}" }
hovered = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
preview_hovered = { underline = true }
find_keyword = { fg = "{{ colors.secondary.default.hex }}", bold = true, italic = true }
find_position = { fg = "{{ colors.tertiary.default.hex }}", bg = "reset", bold = true }
marker_copied = { fg = "{{ colors.tertiary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}" }
marker_cut = { fg = "{{ colors.error.default.hex }}", bg = "{{ colors.error.default.hex }}" }
marker_marked = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
marker_selected = { fg = "{{ colors.secondary.default.hex }}", bg = "{{ colors.secondary.default.hex }}" }
tab_active = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
tab_inactive = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.surface.default.hex }}" }
tab_width = 1
count_copied = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}" }
count_cut = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.error.default.hex }}" }
count_selected = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.secondary.default.hex }}" }
border_symbol = "│"
border_style = { fg = "{{ colors.outline.default.hex }}" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "{{ colors.surface_variant.default.hex }}", bg = "{{ colors.surface_variant.default.hex }}" }
mode_normal = { fg = "{{ colors.background.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
mode_select = { fg = "{{ colors.background.default.hex }}", bg = "{{ colors.secondary.default.hex }}", bold = true }
mode_unset = { fg = "{{ colors.background.default.hex }}", bg = "{{ colors.tertiary.default.hex }}", bold = true }
progress_label = { fg = "{{ colors.on_surface.default.hex }}", bold = true }
progress_normal = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.surface_variant.default.hex }}" }
progress_error = { fg = "{{ colors.error.default.hex }}", bg = "{{ colors.surface_variant.default.hex }}" }
permissions_t = { fg = "{{ colors.primary.default.hex }}" }
permissions_r = { fg = "{{ colors.secondary.default.hex }}" }
permissions_w = { fg = "{{ colors.error.default.hex }}" }
permissions_x = { fg = "{{ colors.tertiary.default.hex }}" }
permissions_s = { fg = "{{ colors.outline.default.hex }}" }

[input]
border = { fg = "{{ colors.primary.default.hex }}" }
title = { fg = "{{ colors.primary.default.hex }}" }
value = { fg = "{{ colors.on_surface.default.hex }}" }
selected = { bg = "{{ colors.surface_variant.default.hex }}" }

[select]
border = { fg = "{{ colors.primary.default.hex }}" }
active = { fg = "{{ colors.primary.default.hex }}", bold = true }
inactive = { fg = "{{ colors.on_surface.default.hex }}" }

[tasks]
border = { fg = "{{ colors.primary.default.hex }}" }
title = { fg = "{{ colors.primary.default.hex }}" }
hovered = { fg = "{{ colors.primary.default.hex }}", underline = true }

[which]
cols = 3
mask = { bg = "{{ colors.surface.default.hex }}" }
cand = { fg = "{{ colors.primary.default.hex }}" }
rest = { fg = "{{ colors.on_surface.default.hex }}" }
desc = { fg = "{{ colors.outline.default.hex }}" }
separator = "  "
separator_style = { fg = "{{ colors.outline.default.hex }}" }

[completion]
border = { fg = "{{ colors.primary.default.hex }}" }
active = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
inactive = { fg = "{{ colors.on_surface.default.hex }}" }

[filetype]
rules = [
  { url = "*/", fg = "{{ colors.primary.default.hex }}", bold = true },
  { mime = "image/*", fg = "{{ colors.secondary.default.hex }}" },
  { mime = "video/*", fg = "{{ colors.secondary.default.hex }}" },
  { mime = "audio/*", fg = "{{ colors.tertiary.default.hex }}" },
  { mime = "application/*zip", fg = "{{ colors.error.default.hex }}" },
  { mime = "application/x-tar", fg = "{{ colors.error.default.hex }}" },
  { mime = "application/x-bzip*", fg = "{{ colors.error.default.hex }}" },
  { mime = "application/x-7z-compressed", fg = "{{ colors.error.default.hex }}" },
  { mime = "application/x-rar", fg = "{{ colors.error.default.hex }}" },
  { mime = "text/*", fg = "{{ colors.on_surface.default.hex }}" },
  { mime = "application/json", fg = "{{ colors.tertiary.default.hex }}" },
  { mime = "application/*toml", fg = "{{ colors.tertiary.default.hex }}" },
  { mime = "application/x-yaml", fg = "{{ colors.tertiary.default.hex }}" },
  { mime = "application/x-executable", fg = "{{ colors.tertiary.default.hex }}", bold = true },
  { mime = "application/x-shellscript", fg = "{{ colors.tertiary.default.hex }}" }
]
